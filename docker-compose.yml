services:
  # =========================================================================
  # Service 1: Eclipse Mosquitto MQTT Broker (Tầng 2 - Network)
  # =========================================================================
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: iot_parking_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_parking_net

  # =========================================================================
  # Service 2: Node-RED Automation Engine & Dashboard (Tầng 3 & Tầng 4)
  # =========================================================================
  nodered:
    build: ./docker/nodered
    container_name: iot_parking_middleware
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - NODE_RED_ENABLE_PROJECTS=false
      - PARKING_DATA_DIR=/data/storage
    volumes:
      - ./docker/nodered/flows.json:/data/flows.json
      - ./docker/nodered/settings.js:/data/settings.js:ro
      - nodered_data:/data
      - ./data:/data/storage
    depends_on:
      - mqtt-broker
    networks:
      - iot_parking_net

networks:
  iot_parking_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  nodered_data:
